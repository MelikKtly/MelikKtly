name: Update README cards

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 06:17 Türkiye time
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - "fonts/**"
      - ".github/workflows/update-cards.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow fonttools

      - name: Render README cards (hero, graph, months, tiles, repos, stack)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/render_readme_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data assets
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
